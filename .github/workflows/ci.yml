name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token needs nothing beyond reading the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 is the minimum: the project relies on node:sqlite and native
        # TypeScript. 25 guards against the next release breaking us.
        node: ['24', '25']

    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is mutable, and
      # CodeLens reports that as a supply-chain finding — the project should
      # pass its own audit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Type check (web)
        run: pnpm typecheck:web

      - name: Tests
        run: pnpm test

      # Measures recall against the fixture's documented defects. Exits non-zero
      # if required-tier recall drops below 100%, or if any finding lands on a
      # file declared clean, so a regression in diagnostic quality fails CI
      # rather than being noticed later.
      - name: Diagnostic accuracy
        run: pnpm eval

      - name: Build web app
        run: pnpm build:web

  self-audit:
    name: scan our own repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # CodeLens scanning CodeLens. This does not gate the build: the point is
      # that the report is always available on a commit, and that we read it.
      - name: Scan this repository
        run: pnpm scan . --name "CodeLens AI" --no-save --out codelens-self-audit

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codelens-self-audit
          path: codelens-self-audit/
          retention-days: 14
